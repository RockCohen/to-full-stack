# ─────────────────────────────────────────────────────────────
# rockcohen.cc — 公网反向代理（多应用）
#
# 本文件是服务器 /etc/nginx/conf.d/headhunter.conf 的软链源，
# 修改后需在服务器执行：nginx -t && systemctl reload nginx。
#
# 站点布局（443）：
#   /                       个人主页（/var/www/static/hub/index.html）
#   /head-hunter            猎头工作台（head-hunter，仅此前缀可达；
#                           剥前缀后转给 web 容器 8080，前端以
#                           VITE_BASE=/head-hunter/ 构建，接口同前缀）
#   /deepseek-harness       DeepSeek Harness 讲义（静态）
#   /fullstack/             全栈之旅互动课程（静态，Vite --base=/fullstack/ 构建）
#   /maoxuan/               毛选方法论（静态，单文件交互站）
#   /paper/ /hub/ /tractatus* 图标等  静态资源
#   /api/comments/          评论服务（127.0.0.1:8787）
#   /api/progress/          全栈之旅学习进度同步（127.0.0.1:8788）
#   其余任意路径             404（不再兜底转发给任何应用）
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name rockcohen.cc www.rockcohen.cc;

    # 给证书申请/续期留的入口
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rockcohen.cc www.rockcohen.cc;

    ssl_certificate     /etc/letsencrypt/live/rockcohen.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rockcohen.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;   # 简历上传（应用内限制 10MB）

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 个人主页
    location = / {
        root /var/www/static;
        try_files /hub/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # ── head-hunter：仅 /head-hunter 前缀可达 ──
    # 不带斜杠的绝对路径 301 补全；未知路径不再转发给本应用。
    location = /head-hunter {
        return 301 /head-hunter/;
    }

    # 应用前缀：剥掉 /head-hunter 后转给 web 容器
    # （页面 /head-hunter/xxx、接口 /head-hunter/api/xxx 均走此处）
    location /head-hunter/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;   # 深度研究等长任务
        proxy_send_timeout 600s;
    }

    # ── DeepSeek Harness 讲义（静态） ──
    location = /deepseek-harness {
        return 301 /deepseek-harness/;
    }

    location /deepseek-harness/ {
        alias /var/www/static/deepseek-harness/;
        add_header Cache-Control "no-cache";
    }

    # ── 全栈之旅互动课程（静态） ──
    location = /fullstack {
        return 301 /fullstack/;
    }

    location /fullstack/ {
        alias /var/www/static/fullstack/;
        add_header Cache-Control "no-cache";
    }

    # ── 数学之旅 · MCS 交互证明讲义（静态） ──
    # 源码在 to-full-stack 仓库 mcs-interactive/，部署脚本 scripts/deploy-mcs.sh
    location = /mcs {
        return 301 /mcs/;
    }

    location /mcs/ {
        alias /var/www/static/mcs/;
        add_header Cache-Control "no-cache";
    }

    # ── 毛选方法论（静态，单文件交互站） ──
    location = /maoxuan {
        return 301 /maoxuan/;
    }

    location /maoxuan/ {
        alias /var/www/static/maoxuan/;
        add_header Cache-Control "no-cache";
    }

    # ── 其余静态页面/资源 ──
    location = /tractatus-mindmap.html {
        root /var/www/static;
        add_header Cache-Control "no-cache";
    }

    location = /tractatus {
        return 301 /tractatus-mindmap.html;
    }

    location = /manifest.webmanifest { root /var/www/static; default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location = /icon-192.png { root /var/www/static; }
    location = /icon-512.png { root /var/www/static; }
    location = /apple-touch-icon.png { root /var/www/static; }

    location /paper/ {
        alias /var/www/static/paper/;
        add_header Cache-Control "no-cache";
    }

    location /hub/ {
        alias /var/www/static/hub/;
        add_header Cache-Control "no-cache";
    }

    # ── 评论服务 ──
    location /api/comments/ {
        proxy_pass http://127.0.0.1:8787/comments/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }

    # ── 全栈之旅学习进度同步 ──
    location /api/progress/ {
        proxy_pass http://127.0.0.1:8788/progress/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }

    # 兜底：未配置的路径一律 404（不再转发给 head-hunter 或其他应用）
    location / {
        return 404;
    }
}
