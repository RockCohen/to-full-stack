# nginx SPA 托管:互动课程平台(web/dist)的运行时配置
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # gzip:文本资源压缩传输(nginx gzip ≈ 你在 Tomcat 开的 compression)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 入口文件:永远不缓存(它是"目录",哈希在它引用的 assets 文件名里)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源:文件名带内容哈希 → 敢于一年长缓存(E3 的"协议"根基)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback:找不到的路径全部回 index.html(E2 的主角,注释掉试试 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
